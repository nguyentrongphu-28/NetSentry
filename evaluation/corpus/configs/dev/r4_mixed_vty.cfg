! Cisco IOS Configuration - Dev Mixed VTY
version 15.6
service password-encryption
!
hostname R4-DEV-MIXED
!
ip ssh version 2
!
enable secret 9 $9$dummysecret1234567890
!
username admin secret 9 $9$dummysecret1234567890
!
no ip http server
!
snmp-server community <REDACTED_COMMUNITY> RO
!
access-list 10 permit 10.0.0.0 0.255.255.255
!
line con 0
 exec-timeout 5 0
 login local
line vty 0 4
 access-class 10 in
 exec-timeout 10 0
 login local
 transport input ssh
line vty 5 15
 exec-timeout 30 0
 login local
 transport input telnet
!
end
