! Cisco IOS Configuration - Dev Secure Baseline
version 15.6
service timestamps debug datetime msec
service timestamps log datetime msec
service password-encryption
!
hostname R1-DEV-SECURE
!
ip ssh version 2
!
enable secret 9 $9$dummysecret1234567890
!
username admin privilege 15 secret 9 $9$dummysecret1234567890
!
no ip http server
no ip http secure-server
!
access-list 10 permit 10.0.0.0 0.255.255.255
!
line con 0
 exec-timeout 5 0
 login local
line vty 0 4
 access-class 10 in
 exec-timeout 10 0
 login local
 transport input ssh
line vty 5 15
 access-class 10 in
 exec-timeout 10 0
 login local
 transport input ssh
!
end
