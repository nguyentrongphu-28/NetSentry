! Cisco IOS Configuration - Test Core Router
version 15.6
no service password-encryption
!
hostname R1-TEST-CORE
!
ip ssh version 2
!
enable secret 9 $9$dummysecret1234567890
!
username admin secret 9 $9$dummysecret1234567890
!
no ip http server
!
snmp-server community public RW
!
access-list 10 permit 10.0.0.0 0.255.255.255
!
line con 0
 exec-timeout 10 0
 login local
line vty 0 4
 access-class 10 in
 exec-timeout 10 0
 login local
 transport input telnet
line vty 5 15
 access-class 10 in
 exec-timeout 10 0
 login local
 transport input telnet
!
end
