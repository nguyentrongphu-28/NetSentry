! Cisco IOS Configuration - Test Hardened Edge Router
version 15.6
service password-encryption
!
hostname R2-TEST-HARDENED
!
ip ssh version 2
!
enable secret 9 $9$dummysecret1234567890
!
username admin privilege 15 secret 9 $9$dummysecret1234567890
!
no ip http server
no ip http secure-server
!
access-list 20 permit 192.168.1.0 0.0.0.255
!
line con 0
 exec-timeout 5 0
 login local
line vty 0 4
 access-class 20 in
 exec-timeout 10 0
 login local
 transport input ssh
line vty 5 15
 access-class 20 in
 exec-timeout 10 0
 login local
 transport input ssh
!
end
