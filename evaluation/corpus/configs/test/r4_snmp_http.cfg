! Cisco IOS Configuration - Test SNMP and HTTP Insecure
version 15.6
service password-encryption
!
hostname R4-TEST-SNMP-HTTP
!
ip ssh version 2
!
enable secret 9 $9$dummysecret1234567890
!
username admin secret 9 $9$dummysecret1234567890
!
ip http server
!
snmp-server community private RW
!
access-list 10 permit 10.0.0.0 0.255.255.255
!
line con 0
 exec-timeout 10 0
 login local
line vty 0 4
 access-class 10 in
 exec-timeout 10 0
 login local
 transport input ssh
line vty 5 15
 access-class 10 in
 exec-timeout 10 0
 login local
 transport input ssh
!
end
