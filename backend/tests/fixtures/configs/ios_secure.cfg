!
! Last configuration change at 12:00:00 UTC Mon Nov 16 2026
!
version 15.2
service timestamps debug datetime msec
service timestamps log datetime msec
service password-encryption
!
hostname Secure-Router
!
boot-start-marker
boot-end-marker
!
enable secret 9 $9$dummyHashValueForSecureConfig999
!
no aaa new-model
ip source-route
!
ip domain name example.com
ip ssh version 2
ip ssh time-out 60
ip ssh authentication-retries 3
!
interface GigabitEthernet0/0
 description Management Interface
 ip address 192.168.1.1 255.255.255.0
 no shutdown
!
interface GigabitEthernet0/1
 description WAN Interface
 ip address 10.0.0.1 255.255.255.252
 no shutdown
!
no ip http server
no ip http secure-server
!
access-list 10 permit 192.168.1.0 0.0.0.255
!
line con 0
 exec-timeout 5 0
 logging synchronous
line aux 0
line vty 0 4
 access-class 10 in
 exec-timeout 5 0
 transport input ssh
line vty 5 15
 access-class 10 in
 exec-timeout 5 0
 transport input ssh
!
end
