!
! Insecure Cisco IOS Configuration Fixture
!
version 15.1
no service password-encryption
!
hostname Insecure-Router
!
enable password FAKE-ENABLE-PW
username labadmin privilege 15 password 0 FAKE-USER-PW
!
ip ssh version 1
!
ip http server
!
snmp-server community FAKE-COMMUNITY-RW RW 10
!
interface GigabitEthernet0/0
 ip address 192.168.1.2 255.255.255.0
 no shutdown
!
line con 0
 password 7 FAKE-CON-PW
line vty 0 4
 exec-timeout 0 0
 password 7 FAKE-VTY-PW
 transport input telnet ssh
line vty 5 15
 exec-timeout 0 0
 password 7 FAKE-VTY-PW
 transport input telnet ssh
!
end
